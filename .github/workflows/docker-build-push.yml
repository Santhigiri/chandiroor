name: Build, Push, and Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: chandiroor
  GCP_PROJECT: santhigiri-496211
  GCP_REGION: asia-south1
  AR_REPO: santhigiri

jobs:
  build-push-deploy:
    runs-on: [self-hosted, proxmox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Tag generation  ---
      - name: Generate version tag
        id: version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          PUSH_NUM=$(git log --oneline \
            --since="${DATE} 00:00:00" --until="${DATE} 23:59:59" \
            "${{ github.sha }}" | wc -l | tr -d ' ')
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TAG="dev-${DATE}.${PUSH_NUM}"
            echo "SERVICE=panchangam-api-dev" >> $GITHUB_OUTPUT
          else
            TAG="${DATE}.${PUSH_NUM}"
            echo "SERVICE=panchangam-api" >> $GITHUB_OUTPUT
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

      # --- GCP auth ---
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      # --- Build ---
      - name: Build Docker image
        run: |
          AR_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          docker build -t "${AR_IMAGE}:${{ steps.version.outputs.TAG }}" -f Dockerfile .

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "${AR_IMAGE}:${{ steps.version.outputs.TAG }}" "${AR_IMAGE}:latest"
          fi

      # --- Push to Artifact Registry ---
      - name: Push image to Artifact Registry
        run: |
          AR_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          docker push "${AR_IMAGE}:${{ steps.version.outputs.TAG }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push "${AR_IMAGE}:latest"
          fi

      # --- (Optional) Also push to Docker Hub, if you still need it ---
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push images to Docker Hub
        run: |
          AR_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          docker tag "${AR_IMAGE}:${{ steps.version.outputs.TAG }}" "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.TAG }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.TAG }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "${AR_IMAGE}:latest" "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
            docker push "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          fi

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

      # --- Deploy to Cloud Run ---
      - name: Deploy to Cloud Run
        run: |
          AR_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          gcloud run deploy ${{ steps.version.outputs.SERVICE }} \
            --image="${AR_IMAGE}:${{ steps.version.outputs.TAG }}" \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }}
